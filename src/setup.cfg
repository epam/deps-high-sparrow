[tool:pytest]
cache_dir = /tmp/test_cache/.pytest_cache

[flake8]
ignore=
    # Class without a base class
    WPS306,
    F405,
    WPS323,
    WPS601,
    WPS410,
    WPS421,
    WPS609,
    F403,
    WPS347,
    WPS440,
    WPS222,
    WPS110,
    WPS230,
    WPS437,
    # Found `f` string
    WPS305,
    # Remove all docstring rules
    D,
    # Remove bad quotes
    Q000,
    # Found empty comment
    WPS464,
    # Found local folder import
    WPS300,
    # Too many base classes
    WPS215,
    # Found `__init__.py` module with logic
    WPS412,
    # Found `else` in a loop without `break`
    WPS500,
    # Found too short name: x
    WPS111,
    # Found function with too much cognitive complexity NEED TO GOOGLE AND SET COGNITIVE
    WPS231,
    # Found incorrectly nested ternary
    WPS509,
    # Found too many imported names from a module
    WPS235,
    # Found string constant over-use
    WPS226,
    # Found a line that starts with a dot
    WPS348,
    # Found multiline conditions
    WPS337,
    # Found module with too many imports
    WPS201,
    # Found using `@staticmethod`
    WPS602,
    # Requests call with verify=False disabling SSL certificate checks, security issue
    S501,
    # Found too long ``try`` body length
    WPS229,
    # line break before binary operator
    W503,
    # Found a too complex `f` string
    WPS237,
    # Found a getter without a return value
    WPS463,
    # Found subclassing a builtin: str
    WPS600,
    # Do not perform function calls in argument defaults. This rule prevents us from using the recommended style of dependency_injector
    B008,
    # Found too many arguments
    WPS211,
    # Found complex default value
    WPS404,
    # Found incorrect unpacking target
    WPS414,
    # Found nested class: Config
    WPS431,
    # Found too many expressions
    WPS213,
    # Found upper-case constant in a class
    WPS115,
    # Found executable mismatch: file is executable but no shebang is present
    WPS453,
    # Found wrong keyword: pass
    WPS420,
    # Missing trailing comma
    C812
    # Found overly complex annotation
    WPS234,
    # Found too long name
    WPS118,
    # Found module cognitive complexity that is too high
    WPS232,
    # Found too many raises in a function
    WPS238,
    # Found too many `elif` branches
    WPS223,
    # Found walrus operator
    WPS332,
    # Found implicit string concatenation
    WPS326,
    # Found multi-line function type annotation
    WPS320,
    # Found too many empty lines in `def`
    WPS473,
    # Found line with high Jones Complexity
    WPS221,
    # Found statement that has no effect
    WPS428,
    # Found implicit `.get()` dict usage
    WPS529,
    # Exception name should be named with an Error suffix
    N818,
    E251,
    E202,
    # Found negated condition
    WPS504,
    # whitespace before ':'
    E203

allowed-domain-names =
    # We allow using 'value' name when creating dictionaries
    value,
    # We are working with files
    file,
    # We use name 'data' in our models
    data,
    # We use it in settings
    info

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

per-file-ignores =
    # There are multiple `assert`s in tests, we allow them:
    */__init__.py: F401
    src/tests/*.py: S101
    ./deps_high_sparrow/entrypoint.py: WPS421, WPS433, WPS430, WPS212
    ./deps_high_sparrow/containers.py: WPS202, WPS203
    ./deps_high_sparrow/api/fastapi_auth.py: WPS430, WPS433
    ./deps_high_sparrow/extras/datasource/backoff.py: WPS232, WPS231, WPS430, WPS220
    ./deps_high_sparrow/domain/model/validation_result/*: WPS125
    ./deps_high_sparrow/domain/model/document_type/validator/validation/services/utils.py: WPS100, WPS202, B009, B010
    ./deps_high_sparrow/domain/model/document_type/validator/*: WPS125, WPS202, F401, WPS204, WPS214, N802
    # WPS604 Found incorrect node inside `class` body
    */commands/*.py: WPS604
    */events/*.py: WPS604, WPS202
    # Found too many methods
    ./deps_high_sparrow/domain/model/document_type/document_type.py: WPS214
    # Found too many module members
    ./deps_high_sparrow/domain/model/shared/guards/checks.py: WPS202
    # Found wrong module name
    ./deps_high_sparrow/shared/utils.py: WPS100


max-local-variables = 15
max-methods = 25
max-line-length = 120

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined, override, misc, return, assignment

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
