[tool.poetry]
name = "high_sparrow"
version = "0.1.0"
description = "Service for validating data extraction results"
authors = []

[tool.poetry.dependencies]
python = "~3.12"
dependency-injector = "^4.48.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.120"
SQLAlchemy = "1.3.12"
us = "^3.1.1"
python-dateutil = "^2.8.2"
iso3166 = "^2.1.1"
iso4217 = "^1.11.20220401"
phonenumbers = "^8.13.29"
types-python-dateutil = "^2.9.0.20240315"
types-requests = "^2.25.6"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
starlette = "^0.49.1"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
flake8 = "^7.1"
wemake-python-styleguide = "^1.0.0"
bandit = "^1.7.5"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
requests-mock = "~1.9.3"
ipdb = "^0.13.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''

[tool.pytest.ini_options]
markers = [
    "model_type_check",
    "model_pre_check",
    "model_business_check",
    "document_type",
    "validator_creation",
    "rule",
    "validation_result",
    "validation_result_creation",
]
