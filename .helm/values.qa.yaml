high_sparrow:
  image:
    path: "/deps-platform/deps-high-sparrow"
  resources: {}

high_sparrow_settings:
  ENV: qa

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  # Telemetry
  INSTRUMENTATION_ENABLED: true

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

high_sparrow_consumer:
  image:
    path: "/deps-platform/deps-high-sparrow"

migrator:
  image:
    path: "/deps-platform/deps-high-sparrow-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-qa'
  roleName: 'k8s-qa'
  vaultKubernetesMountPath: 'kubernetes-qa'

service_account:
  serviceAccountName: 'deps-qa'
